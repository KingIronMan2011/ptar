[package]
name    = "ptar"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "ptar"
path = "src/main.rs"

[dependencies]
clap          = { version = "4",    features = ["derive"] }
jwalk         = "0.9"
zstd          = "0.14"
rayon         = "1"
xxhash-rust   = { version = "0.8",  features = ["xxh3"] }
indicatif     = "0.18"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
panic          = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell"] }
winreg = "0.56.0"
