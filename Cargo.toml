[package]
name    = "ptar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ptar"
path = "src/main.rs"

[dependencies]
clap    = { version = "4",    features = ["derive"] }
jwalk   = "0.8"
zstd    = { version = "0.13", features = ["zstdmt"] }
rayon   = "1"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
panic          = "abort"
