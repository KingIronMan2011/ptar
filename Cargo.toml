[package]
name    = "ptar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ptar"
path = "src/main.rs"

[dependencies]
clap          = { version = "4",    features = ["derive"] }
jwalk         = "0.8"
zstd          = "0.13"
rayon         = "1"
xxhash-rust   = { version = "0.8",  features = ["xxh3"] }
indicatif     = "0.17"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
panic          = "abort"
